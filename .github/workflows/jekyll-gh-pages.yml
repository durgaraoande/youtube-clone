name: Deploy YouTube Clone App with GitHub Pages

on:
  # Trigger on pushes to the default branch
  push:
    branches: ["master"]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16" # Adjust based on your Node.js version

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Set environment variables securely (optional)
      - name: Set environment variables
        run: |
          echo "REACT_APP_YOUTUBE_API=${{ secrets.REACT_APP_YOUTUBE_API }}" >> $GITHUB_ENV

      # Build the application
      - name: Build the application
        run: npm run build

      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build # Ensure this points to your build directory

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
